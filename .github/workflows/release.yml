name: Release source archive

on:
  release:
    types: [published]

permissions:
  contents: read

concurrency:
  group: maintenance-desk-release-${{ github.event.release.tag_name }}
  cancel-in-progress: false

jobs:
  package:
    if: startsWith(github.event.release.tag_name, 'v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out release tag
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name }}
      - name: Install and verify release
        run: |
          npm install
          npm run typecheck
          npm run check:env
          npm run lint
          npm test
          npm run build
      - name: Build source archive
        run: |
          mkdir -p dist
          git archive --format=tar.gz --prefix="maintenance-ops-desk-${GITHUB_REF_NAME}/" \
            --output="dist/maintenance-ops-desk-${GITHUB_REF_NAME}.tar.gz" "$GITHUB_REF_NAME"
      - name: Generate SHA-256 checksum
        run: (cd dist && sha256sum *.tar.gz > maintenance-ops-desk-${GITHUB_REF_NAME}.tar.gz.sha256)
      - name: Attach archive to release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$GITHUB_REF_NAME" dist/*.tar.gz dist/*.sha256 --repo "$GITHUB_REPOSITORY" --clobber
